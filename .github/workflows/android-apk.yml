name: Build Android APK

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name flowly --org com.frezzdev .
      - name: Set Android app display name
        run: sed -i 's/android:label="flowly"/android:label="FlowLy"/' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FlowLy.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowLy-release-apk
          path: build/app/outputs/flutter-apk/FlowLy.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Releases
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'latest' || 'preview' }}
          name: ${{ github.ref == 'refs/heads/main' && 'FlowLy APK — latest build' || 'FlowLy APK — preview build' }}
          body: |
            Автоматическая сборка FlowLy из ветки ${{ github.ref_name }}.

            APK-файл: FlowLy.apk
            Скачать APK напрямую можно из раздела Assets этого релиза.
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/FlowLy.apk
          overwrite_files: true
          make_latest: ${{ github.ref == 'refs/heads/main' }}
