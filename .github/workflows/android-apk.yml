name: Build Android APK

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name flowly --org com.frezzdev .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FlowLy APK — latest build
          body: |
            Автоматическая сборка FlowLy из ветки main.

            APK: app-release.apk
            Для установки скачайте APK из Assets ниже.
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          make_latest: true
